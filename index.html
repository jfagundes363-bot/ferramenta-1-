    <meta charset="UTF-8" />

    <script>
      (function() {
        // Fix "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        // caused by extensions attempting to overwrite window.fetch
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var originalFetch = window.fetch.bind(window);
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              }
            });
          }
        } catch (_) {}

        // Suppress errors injected by third-party browser extensions or Vite dev WebSocket
        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event && event.message && event.message.indexOf('WebSocket') !== -1)
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        // Suppress "Unhandled Rejection: Error: WebSocket closed without opened" from Vite HMR in iframe/dev
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack)) || (typeof reason === 'string' ? reason : '');
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        });
      })();
    </script>
